name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']
    name: JDK ${{ matrix.java }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build and test
        run: ./mvnw -B -ntp install
      # one annotation per failing test class, so the cause shows on the run's summary page
      - name: Report failed tests
        if: failure()
        run: |
          for f in $(grep -lE "<<< (FAILURE|ERROR)" */target/surefire-reports/*.txt 2>/dev/null); do
            msg=$(grep -vE '^\s+at ' "$f" | grep -A8 -E "<<< (FAILURE|ERROR)" | tr '\r\n' '  ' | cut -c1-1500)
            echo "::error title=$(basename "$f" .txt)::${msg}"
          done
