name: Release

# Push a tag like v0.1.0: builds and tests that version, signs it and uploads it to the
# Maven Central Portal. The upload is validated but not published; click Publish in the
# portal to release it (see RELEASING.md).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username-env-var: CENTRAL_USERNAME
          server-password-env-var: CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Set the version from the tag
        run: ./mvnw -B -ntp org.codehaus.mojo:versions-maven-plugin:2.25.2:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false -DprocessAllModules=true
      - name: Build, test, sign and upload to Maven Central
        run: ./mvnw -B -ntp -Prelease deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
